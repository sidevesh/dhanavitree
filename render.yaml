services:
  - type: web
    name: dhanavitree
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run typecheck && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: conversations
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /var/data
